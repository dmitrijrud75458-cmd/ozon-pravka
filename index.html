<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Правщик карточек</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Быстрая правка цен, названий, описаний, характеристик и остатков в Excel-шаблонах Ozon. Работает в браузере, файл никуда не отправляется.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Мастерская правки: рабочая таблица на спокойном зелёно-сером фоне, правки отмечены как маркером */
:root {
  --bg: #EEF1EE;
  --surface: #FFFFFF;
  --sunk: #E4E9E5;
  --ink: #16201B;
  --muted: #5A6862;
  --line: #D3DBD5;
  --line-soft: #E6EBE7;
  --accent: #0B6A4C;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEEE6;
  --mark: #F3C93A;
  --mark-soft: #FFF3C2;
  --bad: #BE3328;
  --bad-soft: #FBE3DF;
  --warn: #9A6400;
  --warn-soft: #FCEFD2;
  --ro: #F5F7F5;
  --shadow: 0 10px 30px rgba(22, 32, 27, .14);
  --f-ui: 'Onest', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1311; --surface: #151C19; --sunk: #1C2521; --ink: #E2E9E5; --muted: #93A29B; --line: #2B3631; --line-soft: #222C28;
    --accent: #43C394; --accent-ink: #04140D; --accent-soft: #173A2D; --mark: #D9AE25; --mark-soft: #3A3212;
    --bad: #FF8073; --bad-soft: #3D1E1A; --warn: #E9B04A; --warn-soft: #362A10; --ro: #121815; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1311; --surface: #151C19; --sunk: #1C2521; --ink: #E2E9E5; --muted: #93A29B; --line: #2B3631; --line-soft: #222C28;
  --accent: #43C394; --accent-ink: #04140D; --accent-soft: #173A2D; --mark: #D9AE25; --mark-soft: #3A3212;
  --bad: #FF8073; --bad-soft: #3D1E1A; --warn: #E9B04A; --warn-soft: #362A10; --ro: #121815; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.app { display: flex; flex-direction: column; height: 100%; min-height: 0; }

/* верхняя панель */
.top { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand b { display: block; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand span { display: block; color: var(--muted); font-size: 12px; }
.file { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 260px; }
.fname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.demo { background: var(--mark-soft); color: var(--ink); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.quiet { border-color: transparent; background: transparent; }
.btn.quiet:hover { background: var(--sunk); }
.btn[disabled] { opacity: .45; cursor: default; filter: none; }
.btn .cnt { font: 500 12px var(--f-num); padding: 1px 7px; border-radius: 99px; background: rgba(255, 255, 255, .22); }
.btn:not(.primary) .cnt { background: var(--sunk); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
select, input[type=text], input[type=search], input[type=number], textarea { height: 34px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 0 10px; min-width: 0; }
textarea { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
select { padding-right: 6px; }

/* уведомление */
.notice { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); border-bottom: 1px solid var(--line);
  padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.notice.err { background: var(--bad-soft); }
.notice .ntext { flex: 1 1 380px; min-width: 0; }
.notice p { margin: 0; }
.notice ol { margin: 4px 0 0; padding-left: 20px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 26px; }

/* панель инструментов */
.bar { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row1, .row2 { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--sunk); }
.seg button { border: 0; background: transparent; padding: 0 12px; height: 32px; cursor: pointer; white-space: nowrap; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.seg button .n { font: 12px var(--f-num); margin-left: 4px; color: var(--muted); }
#search { flex: 1 1 220px; max-width: 340px; }
.cond { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cond label { color: var(--muted); font-size: 13px; }
.cond select { max-width: 210px; }
.cond input { width: 130px; }
.spacer { flex: 1; }
.meta { color: var(--muted); font-size: 12.5px; line-height: 1.9; }
.meta b { color: var(--ink); font-weight: 600; }
.meta .pill { margin-left: 6px; font: 500 12px var(--f-num); padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.meta .pill.err { color: var(--bad); border-color: var(--bad); }
.meta .pill.warn { color: var(--warn); border-color: var(--warn); }
.meta .linkish { margin-left: 8px; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 12.5px; }

/* таблица */
.grid-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--surface); position: relative; }
table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max-content; min-width: 100%; }
.grid th, .grid td { border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); padding: 7px 10px; vertical-align: top; text-align: left; background: var(--surface); }
.grid thead th { position: sticky; top: 0; z-index: 3; background: var(--sunk); border-bottom: 1px solid var(--line); font-weight: 600; font-size: 12.5px; line-height: 1.3; }
.grid th .gr { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid th .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.grid th .m { display: flex; gap: 5px; align-items: center; margin-top: 4px; font: 500 10.5px var(--f-num); color: var(--muted); flex-wrap: wrap; }
.grid th .m i { font-style: normal; font-family: var(--f-ui); font-size: 10.5px; font-weight: 600; padding: 0 5px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); }
.grid th .m i.req { color: var(--bad); border-color: transparent; background: var(--bad-soft); }
.grid th .m i.role { color: var(--accent); border-color: transparent; background: var(--accent-soft); }
.grid th .m i.lock { color: var(--muted); }
.grid .stick { position: sticky; z-index: 2; }
.grid thead .stick { z-index: 4; }
.grid .c-sel { left: 0; width: 58px; min-width: 58px; padding: 7px 6px 7px 10px; }
.grid .c-key { left: 58px; width: 150px; min-width: 150px; border-right: 1px solid var(--line); font-family: var(--f-num); font-size: 12.5px; word-break: break-all; }
.grid td.c-sel { color: var(--muted); font: 11px var(--f-num); }
.grid td.c-sel label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.grid td { font-size: 13.5px; cursor: text; position: relative; }
.grid td.ro { background: var(--ro); color: var(--muted); cursor: default; }
.grid td.num { text-align: right; font-family: var(--f-num); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.grid td .cl { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.grid td.long .cl { -webkit-line-clamp: 3; color: var(--ink); }
.grid td.empty .cl::before { content: "—"; color: var(--line); }
.grid td.chg { background: var(--mark-soft); box-shadow: inset 3px 0 0 var(--mark); }
.grid td.chg.c-key { box-shadow: none; }
.grid td .was { display: block; color: var(--muted); font-size: 11.5px; text-decoration: line-through; text-decoration-thickness: 1px; }
.grid td.err { box-shadow: inset 0 0 0 2px var(--bad); background: var(--bad-soft); }
.grid td.warn { box-shadow: inset 0 0 0 2px var(--warn); }
.grid td.chg.warn { box-shadow: inset 3px 0 0 var(--mark), inset 0 0 0 2px var(--warn); }
.grid tbody tr:hover td:not(.ro):not(.chg):not(.err) { background: var(--bg); }
.grid tbody tr.sel td { background: var(--accent-soft); }
.grid .ed { position: absolute; inset: 0; z-index: 5; display: flex; }
.grid .ed input { width: 100%; height: 100%; min-height: 34px; border: 2px solid var(--accent); border-radius: 0; padding: 0 8px; background: var(--surface); font: inherit; }
.grid td.num .ed input { text-align: right; font-family: var(--f-num); }
.grid .ed .ct { position: absolute; right: 4px; bottom: -18px; font: 11px var(--f-num); background: var(--ink); color: var(--surface); padding: 1px 5px; border-radius: 4px; pointer-events: none; }
.empty-grid { padding: 40px 16px; text-align: center; color: var(--muted); }

/* подвал */
.pager { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--surface); border-top: 1px solid var(--line); font-size: 13px; color: var(--muted);
  padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pager b { color: var(--ink); font: 500 13px var(--f-num); }
.pager .sp { flex: 1; }
.privacy { font-size: 12px; }

/* боковая панель */
.drawer { position: fixed; top: env(safe-area-inset-top, 0px); right: 0; bottom: 0; width: min(440px, 100vw); z-index: 30; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column;
  padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer > header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer h2 { margin: 0; font-size: 16px; font-weight: 700; flex: 1; text-wrap: balance; }
.dr-body { flex: 1; overflow: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 5px; }
.fld > span { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.fld .hint { font-size: 12.5px; color: var(--muted); }
.inl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inl > * { flex: 1 1 120px; }
.radio { display: flex; flex-direction: column; gap: 6px; }
.radio label, .chk { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.chk input, .radio input { margin-top: 3px; accent-color: var(--accent); }
.prev { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.prev .hd { padding: 8px 10px; background: var(--sunk); font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; }
.prev .hd .e { color: var(--bad); font-weight: 500; }
.prev table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.prev td { padding: 5px 10px; border-top: 1px solid var(--line-soft); vertical-align: top; word-break: break-word; }
.prev td:first-child { font-family: var(--f-num); color: var(--muted); width: 34%; }
.prev .to { background: var(--mark-soft); }
.prev .miss { padding: 8px 10px; color: var(--warn); font-size: 12.5px; border-top: 1px solid var(--line-soft); word-break: break-word; }
.chg-list { display: flex; flex-direction: column; gap: 10px; }
.chg-item { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.chg-item .k { font: 600 12.5px var(--f-num); }
.chg-item .nm { color: var(--muted); font-size: 12.5px; margin-bottom: 4px; }
.chg-line { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 4px 0; border-top: 1px dashed var(--line-soft); font-size: 13px; }
.chg-line .f { color: var(--muted); font-size: 12px; }
.chg-line s { color: var(--muted); }
.chg-line .nv { background: var(--mark-soft); padding: 0 3px; border-radius: 3px; }
.chg-line .v { min-width: 0; word-break: break-word; }
.count { font: 12px var(--f-num); color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink); }
.note { font-size: 12.5px; color: var(--muted); }
.was-box { border: 1px dashed var(--line); border-radius: var(--r); padding: 8px 10px; font-size: 13px; color: var(--muted); white-space: pre-wrap; max-height: 160px; overflow: auto; }

/* подсказки списка */
.sugg { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); max-height: 260px; overflow: auto; min-width: 200px; padding: 4px 0; }
.sugg div { padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.sugg div.hl, .sugg div:hover { background: var(--accent-soft); }
.sugg .cap { font-size: 11px; color: var(--muted); cursor: default; text-transform: uppercase; letter-spacing: .05em; }
.sugg .cap:hover { background: none; }

/* тост */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--surface); border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; max-width: min(640px, calc(100vw - 32px)); box-shadow: var(--shadow); }
.toast button { background: transparent; color: var(--surface); border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
:root[data-theme="dark"] .toast button { border-color: rgba(0,0,0,.3); }
.drop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 22%, transparent); font-size: 20px; font-weight: 700; color: var(--ink); border: 3px dashed var(--accent); pointer-events: none; }

@media (max-width: 900px) {
  .app { height: auto; }
  html, body { height: auto; }
  .grid-wrap { max-height: 72vh; flex: none; }
  .cond select { max-width: 160px; }
}
@media (max-width: 560px) {
  .grid .c-key { width: 116px; min-width: 116px; }
  .grid .c-sel { width: 50px; min-width: 50px; }
  .grid .c-key { left: 50px; }
  #search { max-width: none; }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); } to { transform: none; } }
}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="7" fill="var(--accent)"/><path d="M8 10h14M8 15h14M8 20h8" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round"/><rect x="17" y="17.5" width="7" height="5" rx="1.5" fill="var(--mark)"/></svg>
      <div><b>Правщик карточек</b><span>шаблоны Ozon · правки прямо в браузере</span></div>
    </div>
    <div class="file">
      <span class="tag demo" id="demoTag" hidden>пример</span>
      <span class="fname" id="fname">Файл не открыт</span>
      <select id="sheetSel" aria-label="Лист книги" hidden></select>
    </div>
    <div class="acts">
      <label class="btn" for="fileIn" tabindex="0" id="openLbl">Открыть шаблон</label>
      <input type="file" id="fileIn" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
      <button class="btn primary" id="dlBtn" disabled>Скачать с правками <span class="cnt" id="dlCnt">0</span></button>
    </div>
  </header>
  <div class="notice" id="notice" hidden></div>
  <section class="bar" id="bar" hidden>
    <div class="row1">
      <div class="seg" id="presets" role="group" aria-label="Набор колонок"></div>
      <button class="btn small quiet" id="colsBtn">Свои колонки…</button>
      <span class="spacer"></span>
      <button class="btn small" id="undoBtn" disabled title="Ctrl+Z">Отменить</button>
      <button class="btn small" id="chgBtn">Изменения <span class="cnt" id="chgCnt">0</span></button>
      <button class="btn small" id="massBtn">Массовая правка</button>
      <button class="btn small quiet" id="setBtn">Настройка</button>
    </div>
    <div class="row2">
      <input type="search" id="search" placeholder="Поиск: артикул, название, значение" aria-label="Поиск">
      <div class="cond">
        <label for="condCol">Условие</label>
        <select id="condCol"></select>
        <select id="condOp" aria-label="Сравнение">
          <option value="has">содержит</option><option value="eq">равно</option><option value="ne">не равно</option>
          <option value="gt">больше</option><option value="lt">меньше</option><option value="empty">пусто</option><option value="filled">заполнено</option>
        </select>
        <input type="text" id="condVal" placeholder="значение" aria-label="Значение условия">
      </div>
      <div class="seg" id="showSeg" role="group" aria-label="Какие строки показать">
        <button data-show="all" aria-pressed="true">Все</button>
        <button data-show="chg" aria-pressed="false">Изменённые<span class="n" id="nChg"></span></button>
        <button data-show="err" aria-pressed="false">С замечаниями<span class="n" id="nErr"></span></button>
      </div>
    </div>
    <div class="meta" id="meta"></div>
  </section>
  <main class="grid-wrap" id="gridWrap"><table class="grid" id="grid"></table></main>
  <footer class="pager" id="pager" hidden></footer>
</div>
<aside class="drawer" id="drawer" hidden aria-labelledby="drTitle">
  <header><h2 id="drTitle"></h2><button class="btn small quiet" id="drClose" aria-label="Закрыть">Закрыть</button></header>
  <div class="dr-body" id="drBody"></div>
</aside>
<div class="sugg" id="sugg" hidden role="listbox"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* XL — чтение шаблона .xlsx и точечная запись правок.
   Меняются только отредактированные ячейки листа и таблица строк;
   скрытые листы, списки, стили и служебные части файла остаются как были. */
const XL = (() => {
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const NS_PR = 'http://schemas.openxmlformats.org/package/2006/relationships';
  const NS_CT = 'http://schemas.openxmlformats.org/package/2006/content-types';
  const NS_XML = 'http://www.w3.org/XML/1998/namespace';
  const MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

  const parseXml = s => {
    const d = new DOMParser().parseFromString(s, 'application/xml');
    if (d.getElementsByTagName('parsererror').length) throw new Error('Файл повреждён: не читается XML');
    return d;
  };
  const declOf = s => { const m = /^\s*<\?xml[^>]*\?>/.exec(s); return m ? m[0] : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'; };
  const serialize = (doc, decl) => decl + '\n' + new XMLSerializer().serializeToString(doc).replace(/^<\?xml[^>]*\?>\s*/, '');

  function colToIdx(letters) { let n = 0; for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; }
  function idxToCol(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  function splitRef(ref) { const m = /^\$?([A-Z]{1,3})\$?(\d+)$/.exec(ref || ''); return m ? { c: colToIdx(m[1]), r: +m[2] } : null; }
  function parseRange(ref) {
    const [a, b] = String(ref).split(':');
    const p = splitRef(a), q = b ? splitRef(b) : p;
    if (!p || !q) return null;
    return { r1: Math.min(p.r, q.r), c1: Math.min(p.c, q.c), r2: Math.max(p.r, q.r), c2: Math.max(p.c, q.c) };
  }
  function resolvePath(base, target) {
    if (target.startsWith('/')) return target.slice(1);
    const parts = base.split('/'); parts.pop();
    for (const seg of target.split('/')) { if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); }
    return parts.join('/');
  }
  const relsPathOf = p => p ? p.replace(/([^/]+)$/, '_rels/$1.rels') : '_rels/.rels';
  const kids = (el, name) => { const out = []; for (let n = el.firstChild; n; n = n.nextSibling) if (n.nodeType === 1 && n.localName === name) out.push(n); return out; };
  const kid = (el, name) => { for (let n = el.firstChild; n; n = n.nextSibling) if (n.nodeType === 1 && n.localName === name) return n; return null; };

  function siText(si) {
    let s = '';
    for (let n = si.firstChild; n; n = n.nextSibling) {
      if (n.nodeType !== 1) continue;
      if (n.localName === 't') s += n.textContent;
      else if (n.localName === 'r') { const t = kid(n, 't'); if (t) s += t.textContent; }
    }
    return s;
  }
  function numText(v) {
    const n = Number(v);
    if (!isFinite(n) || v === '' || v == null) return v == null ? '' : String(v);
    const r = Math.round(n * 1e9) / 1e9;
    return String(r);
  }

  async function readRels(zip, partPath) {
    const f = zip.file(relsPathOf(partPath));
    const out = {};
    if (!f) return out;
    const d = parseXml(await f.async('string'));
    for (const rel of d.getElementsByTagNameNS(NS_PR, 'Relationship')) {
      const mode = rel.getAttribute('TargetMode');
      out[rel.getAttribute('Id')] = { type: rel.getAttribute('Type') || '', target: mode === 'External' ? rel.getAttribute('Target') : resolvePath(partPath, rel.getAttribute('Target') || '') };
    }
    return out;
  }

  /* Открыть книгу: листы, общая таблица строк, имена диапазонов */
  async function open(buf) {
    if (typeof JSZip === 'undefined') throw new Error('Не загрузилась библиотека чтения xlsx. Проверьте интернет и обновите страницу.');
    let zip;
    try { zip = await JSZip.loadAsync(buf); } catch (e) { throw new Error('Это не .xlsx: файл не открывается как книга Excel. Старый формат .xls сначала пересохраните в .xlsx.'); }
    const root = await readRels(zip, '');
    let wbPath = 'xl/workbook.xml';
    for (const id in root) if (/\/officeDocument$/.test(root[id].type)) wbPath = root[id].target;
    const wbFile = zip.file(wbPath);
    if (!wbFile) throw new Error('В файле нет книги Excel (workbook.xml).');
    const wbDoc = parseXml(await wbFile.async('string'));
    const rels = await readRels(zip, wbPath);
    const sheets = [];
    for (const s of wbDoc.getElementsByTagNameNS(NS, 'sheet')) {
      const rid = s.getAttributeNS(NS_R, 'id') || s.getAttribute('r:id');
      const rel = rels[rid];
      if (!rel || !/\/worksheet$/.test(rel.type)) continue; // листы-диаграммы пропускаем
      sheets.push({ name: s.getAttribute('name'), state: s.getAttribute('state') || 'visible', path: rel.target });
    }
    let sstPath = null, calcPath = null, sst = [];
    for (const id in rels) {
      if (/\/sharedStrings$/.test(rels[id].type)) sstPath = rels[id].target;
      if (/\/calcChain$/.test(rels[id].type)) calcPath = rels[id].target;
    }
    if (sstPath && zip.file(sstPath)) {
      const d = parseXml(await zip.file(sstPath).async('string'));
      sst = kids(d.documentElement, 'si').map(siText);
    }
    const names = {};
    for (const dn of wbDoc.getElementsByTagNameNS(NS, 'definedName')) names[dn.getAttribute('name').toLowerCase()] = dn.textContent.trim();
    return { zip, wbPath, sheets, sst, sstPath, calcPath, names, cache: {} };
  }

  /* Прочитать лист: значения, объединения, списки допустимых значений */
  async function readSheet(wb, name) {
    if (wb.cache[name]) return wb.cache[name];
    const sh = wb.sheets.find(s => s.name === name);
    if (!sh) throw new Error('Лист «' + name + '» не найден');
    const f = wb.zip.file(sh.path);
    if (!f) throw new Error('Лист «' + name + '» пуст или повреждён');
    const doc = parseXml(await f.async('string'));
    const rows = new Map();
    let maxRow = 0, maxCol = -1, rPrev = 0;
    for (const row of doc.getElementsByTagNameNS(NS, 'row')) {
      const r = +row.getAttribute('r') || rPrev + 1; rPrev = r;
      let cPrev = -1; const cells = new Map();
      for (let c = row.firstChild; c; c = c.nextSibling) {
        if (c.nodeType !== 1 || c.localName !== 'c') continue;
        const ref = splitRef(c.getAttribute('r'));
        const ci = ref ? ref.c : cPrev + 1; cPrev = ci;
        const t = c.getAttribute('t') || 'n';
        const vEl = kid(c, 'v');
        let v = '', isNum = false;
        if (t === 's') v = vEl ? (wb.sst[+vEl.textContent] ?? '') : '';
        else if (t === 'inlineStr') { const is = kid(c, 'is'); v = is ? siText(is) : ''; }
        else if (t === 'str' || t === 'e' || t === 'd') v = vEl ? vEl.textContent : '';
        else if (t === 'b') v = vEl ? (vEl.textContent === '1' ? 'ИСТИНА' : 'ЛОЖЬ') : '';
        else { v = vEl ? numText(vEl.textContent) : ''; isNum = v !== ''; }
        const hasF = !!kid(c, 'f');
        if (v === '' && !hasF) continue;
        cells.set(ci, { v, num: isNum, f: hasF });
        if (ci > maxCol) maxCol = ci;
      }
      if (cells.size) { rows.set(r, cells); if (r > maxRow) maxRow = r; }
    }
    const merges = [];
    for (const m of doc.getElementsByTagNameNS(NS, 'mergeCell')) { const g = parseRange(m.getAttribute('ref')); if (g) merges.push(g); }
    const lists = [];
    for (const dv of doc.getElementsByTagNameNS('*', 'dataValidation')) {
      if ((dv.getAttribute('type') || '') !== 'list') continue;
      let sq = dv.getAttribute('sqref'), f1 = '';
      const f1El = kid(dv, 'formula1');
      if (f1El) { const inner = kid(f1El, 'f'); f1 = (inner || f1El).textContent; }
      if (!sq) { const s = kid(dv, 'sqref'); sq = s ? s.textContent : ''; }
      if (!sq || !f1) continue;
      lists.push({ ranges: sq.trim().split(/\s+/).map(parseRange).filter(Boolean), formula: f1.trim() });
    }
    const out = { name, rows, maxRow, maxCol, merges, lists, hidden: sh.state !== 'visible' };
    wb.cache[name] = out;
    return out;
  }

  /* Значения выпадающего списка по формуле проверки данных */
  async function listValues(wb, sheetName, formula) {
    let f = formula.replace(/^=/, '').trim();
    if (/^".*"$/s.test(f)) return [...new Set(f.slice(1, -1).split(',').map(s => s.trim()).filter(Boolean))];
    if (wb.names[f.toLowerCase()]) f = wb.names[f.toLowerCase()].replace(/^=/, '');
    const m = /^(?:'((?:[^']|'')+)'|([^!'"]+))!(\$?[A-Z]{1,3}\$?\d+(?::\$?[A-Z]{1,3}\$?\d+)?)$/.exec(f);
    let target = sheetName, ref = f;
    if (m) { target = (m[1] || m[2]).replace(/''/g, "'"); ref = m[3]; }
    const g = parseRange(ref);
    if (!g || !wb.sheets.some(s => s.name === target)) return null;
    const sd = await readSheet(wb, target);
    const vals = [];
    for (let r = g.r1; r <= Math.min(g.r2, sd.maxRow); r++) {
      const row = sd.rows.get(r); if (!row) continue;
      for (let c = g.c1; c <= g.c2; c++) { const x = row.get(c); if (x && String(x.v).trim()) vals.push(String(x.v).trim()); }
    }
    return [...new Set(vals)];
  }

  function cleanText(s) {
    return String(s).replace(/\r\n?/g, '\n').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '');
  }

  /* Собрать файл с правками. edits: [{r, c, value, numeric}] — numeric: писать числом */
  async function exportFile(buf, sheetName, edits) {
    const zip = await JSZip.loadAsync(buf);
    const wbh = await open(buf); // свежая книга: пути и общая таблица строк
    const sh = wbh.sheets.find(s => s.name === sheetName);
    if (!sh) throw new Error('Лист «' + sheetName + '» не найден в исходном файле');
    const src = await zip.file(sh.path).async('string');
    const doc = parseXml(src);
    const rootEl = doc.documentElement;
    const pfx = rootEl.prefix;
    const q = n => pfx ? pfx + ':' + n : n;
    const mk = n => doc.createElementNS(NS, q(n));
    const sheetData = doc.getElementsByTagNameNS(NS, 'sheetData')[0];
    if (!sheetData) throw new Error('В листе нет данных');

    // общая таблица строк
    let sstDoc = null, sstRoot = null, sstMap = null, sstAdded = 0, sstRefs = 0, sstDecl = '';
    if (wbh.sstPath && zip.file(wbh.sstPath)) {
      const s = await zip.file(wbh.sstPath).async('string');
      sstDecl = declOf(s);
      sstDoc = parseXml(s); sstRoot = sstDoc.documentElement;
      sstMap = new Map();
      kids(sstRoot, 'si').forEach((si, i) => {
        const ch = kids(si, 't');
        if (ch.length === 1 && kids(si, 'r').length === 0 && !sstMap.has(ch[0].textContent)) sstMap.set(ch[0].textContent, i);
      });
    }
    const sstCount = () => kids(sstRoot, 'si').length;
    let sstLen = sstRoot ? sstCount() : 0;
    function sstIndex(text) {
      if (!sstRoot) return null;
      sstRefs++;
      if (sstMap.has(text)) return sstMap.get(text);
      const sp = sstRoot.prefix ? sstRoot.prefix + ':' : '';
      const si = sstDoc.createElementNS(NS, sp + 'si');
      const t = sstDoc.createElementNS(NS, sp + 't');
      if (/^\s|\s$|\n/.test(text)) t.setAttributeNS(NS_XML, 'xml:space', 'preserve');
      t.textContent = text;
      si.appendChild(t); sstRoot.appendChild(si);
      const idx = sstLen++; sstMap.set(text, idx); sstAdded++;
      return idx;
    }

    // индекс строк
    const rowEls = new Map(); let rPrev = 0;
    for (const row of kids(sheetData, 'row')) { const r = +row.getAttribute('r') || rPrev + 1; rPrev = r; rowEls.set(r, row); }
    function getRow(r) {
      let row = rowEls.get(r);
      if (row) return row;
      row = mk('row'); row.setAttribute('r', String(r));
      let before = null;
      for (const [rr, el] of rowEls) if (rr > r && (!before || rr < before.r)) before = { r: rr, el };
      sheetData.insertBefore(row, before ? before.el : null);
      rowEls.set(r, row);
      return row;
    }
    function getCell(row, r, c) {
      let cPrev = -1, before = null;
      for (let n = row.firstChild; n; n = n.nextSibling) {
        if (n.nodeType !== 1 || n.localName !== 'c') continue;
        const ref = splitRef(n.getAttribute('r'));
        const ci = ref ? ref.c : cPrev + 1; cPrev = ci;
        if (ci === c) { if (!n.getAttribute('r')) n.setAttribute('r', idxToCol(c) + r); return n; }
        if (ci > c && !before) before = n;
      }
      const cell = mk('c'); cell.setAttribute('r', idxToCol(c) + r);
      if (!before) { for (let n = row.firstChild; n; n = n.nextSibling) if (n.nodeType === 1 && n.localName === 'extLst') { before = n; break; } }
      row.insertBefore(cell, before);
      const sp = row.getAttribute('spans');
      if (sp) { const [a, b] = sp.split(':').map(Number); if (c + 1 < a || c + 1 > b) row.setAttribute('spans', Math.min(a, c + 1) + ':' + Math.max(b, c + 1)); }
      return cell;
    }

    let formulaTouched = false;
    const sharedKill = new Set();
    for (const e of edits) {
      const cell = getCell(getRow(e.r), e.r, e.c);
      for (const n of [...cell.childNodes]) {
        if (n.nodeType === 1 && (n.localName === 'f' || n.localName === 'v' || n.localName === 'is')) {
          if (n.localName === 'f') {
            formulaTouched = true;
            if (n.getAttribute('t') === 'shared' && n.getAttribute('ref') && n.getAttribute('si') != null) sharedKill.add(n.getAttribute('si'));
          }
          cell.removeChild(n);
        } else if (n.nodeType !== 1) cell.removeChild(n);
      }
      cell.removeAttribute('t'); cell.removeAttribute('cm'); cell.removeAttribute('vm');
      const val = cleanText(e.value ?? '');
      if (val === '') continue;
      const ext = kid(cell, 'extLst');
      if (e.numeric) {
        const v = mk('v'); v.textContent = String(val); cell.insertBefore(v, ext);
      } else {
        const idx = sstIndex(val);
        if (idx != null) { cell.setAttribute('t', 's'); const v = mk('v'); v.textContent = String(idx); cell.insertBefore(v, ext); }
        else {
          cell.setAttribute('t', 'inlineStr');
          const is = mk('is'), t = mk('t');
          if (/^\s|\s$|\n/.test(val)) t.setAttributeNS(NS_XML, 'xml:space', 'preserve');
          t.textContent = val; is.appendChild(t); cell.insertBefore(is, ext);
        }
      }
    }
    // общая формула, у которой правили «главную» ячейку: зависимые ячейки оставляем значениями
    if (sharedKill.size) {
      for (const f of [...doc.getElementsByTagNameNS(NS, 'f')]) {
        if (f.getAttribute('t') === 'shared' && sharedKill.has(f.getAttribute('si'))) f.parentNode.removeChild(f);
      }
    }
    zip.file(sh.path, serialize(doc, declOf(src)));

    if (sstRoot && sstAdded + sstRefs > 0) {
      sstRoot.setAttribute('uniqueCount', String(sstLen));
      const cnt = +sstRoot.getAttribute('count') || 0;
      sstRoot.setAttribute('count', String(Math.max(cnt + sstRefs, sstLen)));
      zip.file(wbh.sstPath, serialize(sstDoc, sstDecl));
    }
    // правили ячейку с формулой — убираем цепочку пересчёта, Excel соберёт её заново
    if (formulaTouched && wbh.calcPath && zip.file(wbh.calcPath)) {
      zip.remove(wbh.calcPath);
      const rp = relsPathOf(wbh.wbPath), rs = await zip.file(rp).async('string'), rd = parseXml(rs);
      for (const rel of [...rd.getElementsByTagNameNS(NS_PR, 'Relationship')]) if (/\/calcChain$/.test(rel.getAttribute('Type') || '')) rel.parentNode.removeChild(rel);
      zip.file(rp, serialize(rd, declOf(rs)));
      const cs = await zip.file('[Content_Types].xml').async('string'), cd = parseXml(cs);
      for (const o of [...cd.getElementsByTagNameNS(NS_CT, 'Override')]) if (resolvePath('', (o.getAttribute('PartName') || '').replace(/^\//, '')) === wbh.calcPath) o.parentNode.removeChild(o);
      zip.file('[Content_Types].xml', serialize(cd, declOf(cs)));
    }
    return zip.generateAsync({ type: 'blob', mimeType: MIME, compression: 'DEFLATE', compressionOptions: { level: 6 } });
  }

  return { open, readSheet, listValues, exportFile, colToIdx, idxToCol, parseRange, splitRef, MIME };
})();

/* Model — разбор структуры шаблона Ozon, роли колонок, проверки и массовые правила */
const Model = (() => {
  const norm = s => String(s ?? '').toLowerCase().replace(/ё/g, 'е').replace(/[\r\n\t]+/g, ' ').replace(/\s+/g, ' ').trim();
  const KEY_RE = /^(артикул|артикул продавца|ваш артикул|артикул товара|offer[_ ]?id)( ?[,(:].*)?$/;
  const MARK_RE = /^(не)?редактируем/;
  const SERVICE_KEY_RE = /^((не)?редактируем|ваш артикул|артикул|обязательн|необязательн|укажите|заполн|пример|например|введите|выберите)/;
  const HINT_RE = /(укажите|выберите|заполн|обязательн|значени|из списка|через |ссылк|целое число|заполняется|нередактир|редактир)/;

  const ROLE_RULES = [
    ['oldprice', /зач[её]ркнут|до скидки|старая цена|цена без скидки/],
    ['minprice', /минимальн[а-я]* цен|ограничение для акций/],
    ['siteprice', /цена на сайте|цена для покупател/],
    ['price', /предельная цена|ваша цена|^цена([ ,*(.]|$)|цена с уч[её]том|цена товара|новая цена|текущая цена|цена продажи/],
    ['stock', /остат|^количество|доступно|^кол-во/],
    ['warehouse', /склад/],
    ['name', /название товара|наименование|^название([ ,(]|$)/],
    ['desc', /аннотац|описани/],
    ['vat', /ндс/],
    ['media', /фото|изображ|видео|ссылк|rich|json|pdf|документац/],
    ['tags', /хештег|хэштег|ключевые слова|^#/],
    ['dims', /^вес|ширина|высота|длина|глубина/],
    ['service', /^№$|^n$|ozon id|ozon sku|sku id|^sku$|штрихкод|barcode|комисси|наценк|себестоим|^id$/],
  ];
  const ROLE_LABEL = { price: 'цена', price2: 'цена', oldprice: 'зачёркнутая', minprice: 'ограничение', siteprice: 'на сайте', stock: 'остаток', name: 'название', desc: 'описание', key: 'ключ', warehouse: 'склад', vat: 'НДС' };
  const NUM_ROLES = new Set(['price', 'price2', 'oldprice', 'minprice', 'siteprice', 'stock', 'dims']);

  function parseNum(s) {
    if (s == null) return NaN;
    const t = String(s).replace(/[\s  ]/g, '').replace(/(руб\.?|р\.|₽)$/i, '').replace(',', '.');
    return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : NaN;
  }
  const fmtNum = n => String(Math.round(n * 100) / 100);
  const val = (sd, r, c) => { const row = sd.rows.get(r); const x = row && row.get(c); return x ? String(x.v) : ''; };

  function headerGuess(sd) {
    let best = null;
    for (let r = 1; r <= Math.min(sd.maxRow, 40); r++) {
      const row = sd.rows.get(r); if (!row) continue;
      let text = 0, key = -1;
      for (const [c, x] of row) {
        const t = norm(x.v).replace(/\*/g, '').trim();
        if (!t) continue;
        if (!x.num && isNaN(parseNum(t)) && t.length <= 90) text++;
        if (key < 0 && KEY_RE.test(t)) key = c;
      }
      const score = (key >= 0 ? 1000 : 0) + text;
      if (!best || score > best.score) best = { r, key, score };
    }
    return best || { r: 1, key: -1, score: 0 };
  }

  function isHintRow(sd, r) {
    const row = sd.rows.get(r); if (!row) return false;
    let n = 0, h = 0;
    for (const [, x] of row) { const t = norm(x.v); if (!t) continue; n++; if (HINT_RE.test(t)) h++; }
    return h >= 2 && h / n >= 0.3;
  }

  /* Оценить лист: насколько он похож на таблицу товаров */
  function sheetScore(sd) {
    if (!sd.maxRow) return -1;
    const h = headerGuess(sd);
    let rows = 0;
    const key = h.key >= 0 ? h.key : 0;
    for (let r = h.r + 1; r <= sd.maxRow; r++) if (val(sd, r, key).trim()) rows++;
    return (h.key >= 0 ? 100000 : 0) + h.score * 10 + Math.min(rows, 5000) / 10;
  }

  /* Разобрать структуру: строка заголовков, служебные строки, колонки и роли */
  async function analyze(wb, sd, o = {}) {
    const g = headerGuess(sd);
    const hr = o.headerRow || g.r;
    const hrow = sd.rows.get(hr) || new Map();

    let markRow = 0; const locked = new Set();
    for (const rr of [hr + 1, hr + 2]) {
      const row = sd.rows.get(rr); if (!row) continue;
      let cnt = 0; for (const [, x] of row) if (MARK_RE.test(norm(x.v))) cnt++;
      if (cnt >= 2) { markRow = rr; for (const [c, x] of row) if (/^нередактируем/.test(norm(x.v))) locked.add(c); break; }
    }

    let key = o.keyCol >= 0 ? o.keyCol : -1;
    if (key < 0) for (const [c, x] of hrow) if (KEY_RE.test(norm(x.v).replace(/\*/g, '').trim())) { key = c; break; }
    if (key < 0) key = hrow.size ? Math.min(...hrow.keys()) : 0;

    let start = o.dataRow || 0;
    if (!start) {
      for (let r = (markRow || hr) + 1; r <= sd.maxRow; r++) {
        const k = norm(val(sd, r, key));
        if (!k) continue;
        if (SERVICE_KEY_RE.test(k) || k.length > 60 || isHintRow(sd, r)) continue;
        start = r; break;
      }
      if (!start) start = (markRow || hr) + 1;
    }
    const rows = [];
    for (let r = start; r <= sd.maxRow; r++) if (val(sd, r, key).trim()) rows.push(r);

    // группы колонок из строки над заголовками (объединённые ячейки)
    const groups = {};
    if (hr > 1) {
      const gr = hr - 1, span = Math.max(sd.maxCol + 1, 1);
      for (const m of sd.merges) {
        if (m.r1 > gr || m.r2 < gr) continue;
        if ((m.c2 - m.c1 + 1) / span >= 0.9) continue;
        const t = val(sd, m.r1, m.c1).trim(); if (!t) continue;
        for (let c = m.c1; c <= m.c2; c++) groups[c] = t;
      }
      const grow = sd.rows.get(gr);
      if (grow && Object.keys(groups).length) for (const [c, x] of grow) if (!groups[c] && String(x.v).trim()) groups[c] = String(x.v).trim();
    }

    const maxC = Math.max(sd.maxCol, hrow.size ? Math.max(...hrow.keys()) : 0);
    const cols = [];
    for (let c = 0; c <= maxC; c++) {
      const raw = hrow.get(c) ? String(hrow.get(c).v) : '';
      const title = raw.replace(/\s+/g, ' ').trim();
      let filled = 0, nums = 0;
      for (const r of rows) { const v = val(sd, r, c).trim(); if (v) { filled++; if (!isNaN(parseNum(v))) nums++; } }
      if (!title && !filled) continue;
      const t = norm(title).replace(/\*/g, '').trim();
      let role = c === key ? 'key' : '';
      if (!role) for (const [rl, re] of ROLE_RULES) if (re.test(t)) { role = rl; break; }
      cols.push({
        c, letter: XL.idxToCol(c), title: title.replace(/\s*\*\s*$/, '') || ('Колонка ' + XL.idxToCol(c)),
        required: /\*/.test(title), locked: locked.has(c) || c === key, marked: locked.has(c),
        group: groups[c] || '', role, filled, mostlyNum: filled >= 3 && nums / filled >= 0.8,
        list: null, listFormula: null,
      });
    }
    // одна главная колонка на роль цены: редактируемая, «новая», «без акций»
    for (const rl of ['price', 'oldprice', 'minprice', 'stock', 'name', 'desc']) {
      const cand = cols.filter(x => x.role === rl);
      if (cand.length < 2) continue;
      const rank = x => (x.marked ? 0 : 100) + (/нов/i.test(x.title) ? 10 : 0) + (/без акций/i.test(x.title) ? 5 : 0);
      cand.sort((a, b) => rank(b) - rank(a) || a.c - b.c);
      cand.slice(1).forEach(x => { x.role = rl === 'price' ? 'price2' : (rl + '2'); });
    }
    if (o.roles) for (const rl in o.roles) {
      const want = o.roles[rl];
      for (const x of cols) if (x.role === rl && x.c !== want) x.role = '';
      const t = want >= 0 ? cols.find(x => x.c === want) : null; if (t && want !== key) t.role = rl;
    }
    for (const x of cols) x.numeric = NUM_ROLES.has(x.role) || (x.mostlyNum && !['key', 'vat', 'service', 'name', 'desc'].includes(x.role) && !x.list);

    // списки допустимых значений
    const last = rows.length ? rows[rows.length - 1] : start;
    for (const lv of sd.lists) {
      for (const g of lv.ranges) {
        if (g.r2 < start || g.r1 > Math.max(last, start)) continue;
        for (const x of cols) if (x.c >= g.c1 && x.c <= g.c2 && !x.listFormula) x.listFormula = lv.formula;
      }

    for (const x of cols) if (x.listFormula) {
      try { x.list = await XL.listValues(wb, sd.name, x.listFormula); } catch (e) { x.list = null; }

  /* Наборы колонок */
  function presets(M) {
    const key = M.byRole.key, name = M.byRole.name;
    const base = [key, name].filter(Boolean);
    const pick = f => base.concat(M.cols.filter(x => !base.includes(x) && f(x)));

    const out = [
      { id: 'prices', label: 'Цены', cols: pick(x => /price/.test(x.role) || x.role === 'vat' || priceRe.test(x.title)) },
      { id: 'texts', label: 'Тексты', cols: pick(x => ['desc', 'desc2', 'tags', 'name2'].includes(x.role)) },
      { id: 'chars', label: 'Характеристики', cols: pick(x => hasCharGroup ? /характерист/i.test(x.group) : !NON_CHAR.has(x.role)) },
      { id: 'stocks', label: 'Остатки', cols: pick(x => ['stock', 'stock2', 'warehouse'].includes(x.role)) },

  }
  function defaultPreset(M, list) {

    if (has('prices')) return 'prices';
    if (M.cols.length <= 14 || !has('texts')) return 'all';
    return 'texts';
  }

  /* Правило Ozon о разнице с зачёркнутой ценой (не подтверждено справкой — отключаемая подсказка) */
  function gapOk(p, o) {
    if (p < 400) return o - p >= 20;
    if (p <= 10000) return o - p >= p * 0.05;
    return o - p >= 500;
  }
  function gapNeed(p) { return p < 400 ? '20 ₽' : p <= 10000 ? '5 %' : '500 ₽'; }

  /* Проверка строки. get(c) — текущее значение, edited(c) — правилась ли ячейка */
  function checkRow(M, get, edited, cfg) {
    const out = new Map();
    const put = (c, lvl, msg) => { const prev = out.get(c); if (!prev || (prev.lvl === 'warn' && lvl === 'err')) out.set(c, { lvl, msg }); };
    const R = M.byRole;
    let price = NaN;
    if (R.price) {
      const s = get(R.price.c);
      if (s !== '') { price = parseNum(s); if (isNaN(price)) put(R.price.c, 'err', 'Цена должна быть числом'); else if (price <= 0) put(R.price.c, 'err', 'Цена должна быть больше нуля'); }
    }
    if (isNaN(price)) for (const x of M.cols) if (x.role === 'price2') { const n = parseNum(get(x.c)); if (!isNaN(n) && n > 0) { price = n; break; } }
    if (R.oldprice) {
      const s = get(R.oldprice.c);
      if (s !== '') {
        const o = parseNum(s);
        if (isNaN(o)) put(R.oldprice.c, 'err', 'Зачёркнутая цена должна быть числом');
        else if (o < 0) put(R.oldprice.c, 'err', 'Цена не может быть отрицательной');
        else if (o > 0 && !isNaN(price)) {
          if (o <= price) put(R.oldprice.c, 'err', 'Зачёркнутая цена должна быть выше цены (' + fmtNum(price) + ')');
          else if (cfg.gap && !gapOk(price, o)) put(R.oldprice.c, 'warn', 'Маленькая разница с ценой: скидку могут не показать. Для цены ' + fmtNum(price) + ' нужно от ' + gapNeed(price));
        }
      }
    }
    if (R.minprice) {
      const s = get(R.minprice.c);
      if (s !== '') {
        const m = parseNum(s);
        if (isNaN(m)) put(R.minprice.c, 'err', 'Ограничение должно быть числом');
        else if (!isNaN(price) && m > price) put(R.minprice.c, 'err', 'Ограничение для акций выше цены (' + fmtNum(price) + ')');
      }
    }
    for (const x of M.cols) {
      const s = get(x.c);
      if (x.role === 'stock' || x.role === 'stock2') {
        if (s !== '') { const n = parseNum(s); if (isNaN(n) || n < 0 || n !== Math.floor(n)) put(x.c, 'err', 'Остаток — целое число от 0'); }
        continue;
      }
      if (!edited(x.c)) continue;
      if (x.numeric && s !== '' && isNaN(parseNum(s))) put(x.c, 'err', 'Нужно число');
      if (x.required && s.trim() === '') put(x.c, 'err', 'Обязательное поле');
      if (x.list && s.trim() !== '') {
        const bad = s.split(';').map(v => v.trim()).filter(v => v && !x.list.some(l => l.toLowerCase() === v.toLowerCase()));
        if (bad.length) put(x.c, 'warn', 'Нет в списке значений шаблона: ' + bad.join('; '));
      }
    }
    return out;
  }

  /* Округление: шаг 1/10/100 или «окончание» 9/90/99 */
  function roundBy(x, mode, dir) {
    if (!mode || isNaN(x)) return x;
    const steps = { '1': [1, 0], '10': [10, 0], '100': [100, 0], 'e9': [10, 9], 'e90': [100, 90], 'e99': [100, 99] };

    if (!s) return x;
    const down = Math.floor((x - e) / s) * s + e;
    const up = down >= x - 1e-9 ? down : down + s;
    const dn = down <= x + 1e-9 ? down : down - s;
    if (dir === 'up') return up;
    if (dir === 'down') return dn;
    return (x - dn) <= (up - x) ? dn : up;
  }

  /* Массовое правило. Возвращает изменения [{r, from, to}] и ненайденные ключи для вставки */
  function computeMass(M, rows, col, op, p, get) {

    const isNumOp = ['pct+', 'pct-', 'add', 'sub', 'fromcol', 'round'].includes(op);
    const num = v => parseNum(v);
    let pasted = null;
    if (op === 'paste') {
      pasted = new Map();

        if (!line.trim()) continue;

        if (k) pasted.set(norm(k), v);

    for (const r of rows) {
      const from = get(r, col.c);
      let to = from;
      if (isNumOp) {
        const x = op === 'fromcol' ? num(get(r, p.src)) : num(from);
        if (isNaN(x)) continue;
        let y = x;
        const k = num(p.value);
        if (op === 'pct+') { if (isNaN(k)) continue; y = x * (1 + k / 100); }
        else if (op === 'pct-') { if (isNaN(k)) continue; y = x * (1 - k / 100); }
        else if (op === 'add') { if (isNaN(k)) continue; y = x + k; }
        else if (op === 'sub') { if (isNaN(k)) continue; y = x - k; }
        else if (op === 'fromcol') { const m = isNaN(num(p.k)) ? 1 : num(p.k); y = x * m; }
        y = roundBy(y, p.round, p.dir);
        to = fmtNum(y);
      } else if (op === 'set') to = String(p.value ?? '');
      else if (op === 'clear') to = '';
      else if (op === 'replace') {
        if (!p.find) continue;
        to = p.cs ? from.split(p.find).join(p.repl ?? '') : from.replace(new RegExp(escRe(p.find), 'gi'), () => p.repl ?? '');
      } else if (op === 'prefix') { const a = String(p.value ?? ''); if (!a || from.startsWith(a)) continue; to = a + from; }
      else if (op === 'suffix') { const a = String(p.value ?? ''); if (!a || from.endsWith(a)) continue; to = from + a; }
      else if (op === 'spaces') to = from.split('\n').map(l => l.replace(/[ \t ]+/g, ' ').trim()).join('\n').replace(/\n{3,}/g, '\n\n').trim();
      else if (op === 'paste') {
        const k = norm(get(r, M.key));
        if (!pasted.has(k)) continue;
        seen.add(k);
        to = pasted.get(k);
        if (col.numeric && !isNaN(num(to))) to = fmtNum(num(to));
      }
      if (to !== from) out.push({ r, from, to }); else same++;
    }
    if (pasted) for (const k of pasted.keys()) if (!seen.has(k)) missing.push(k);
    return { changes: out, missing, same };
  }

  return { norm, parseNum, fmtNum, analyze, sheetScore, presets, defaultPreset, checkRow, computeMass, roundBy, gapOk, ROLE_LABEL };
})();

  function colWidth(x) {
    if (x.role === 'name') return 300;
    if (isLong(x)) return 360;
    if (x.numeric) return 140;
    if (x.role === 'media' || x.role === 'tags') return 220;
    if (x.list) return 168;
    return 176;
  }
  function disp(v, x) {
    if (v === '') return '';
    if (x.numeric) { const n = Model.parseNum(v); if (!isNaN(n)) return nf.format(n); }
    return v;
  }
  function thHtml(x, prevGroup) {
    const tags = [];
    tags.push(x.letter);
    if (x.required) tags.push('<i class="req">обяз.</i>');
    if (Model.ROLE_LABEL[x.role] && x.role !== 'key') tags.push('<i class="role">' + Model.ROLE_LABEL[x.role] + '</i>');
    if (x.role === 'key') tags.push('<i class="lock">ключ</i>');
    else if (readOnly(x)) tags.push('<i class="lock">только чтение</i>');
    if (x.list) tags.push('<i>список ' + x.list.length + '</i>');
    const w = x.role === 'key' ? '' : ' style="width:' + colWidth(x) + 'px;min-width:' + colWidth(x) + 'px"';
    const gr = x.group && x.group !== prevGroup && x.role !== 'key' ? '<span class="gr">' + esc(x.group) + '</span>' : '';
    return '<th' + (x.role === 'key' ? ' class="stick c-key"' : '') + w + ' title="' + esc(x.title) + '">' + gr + '<span class="t">' + esc(x.title) + '</span><span class="m">' + tags.join('') + '</span></th>';
  }
  function cellHtml(r, x, iss) {
    const k = r + ':' + x.c, ed = S.edits.has(k), o = orig(r, x.c), v = ed ? S.edits.get(k) : o;
    const cls = [];
    if (x.role === 'key') cls.push('stick c-key');
    if (x.numeric) cls.push('num');
    if (isLong(x)) cls.push('long');
    if (readOnly(x)) cls.push('ro');
    if (ed) cls.push('chg');
    const is = iss && iss.get(x.c);
    if (is) cls.push(is.lvl);
    if (v === '') cls.push('empty');
    let title = is ? is.msg : '';
    if (ed) title += (title ? '\n' : '') + 'Было: ' + (o === '' ? '(пусто)' : o.slice(0, 300));
    let inner = '<div class="cl">' + esc(disp(v, x)) + '</div>';
    if (ed && x.numeric && o !== '') inner += '<s class="was">' + esc(disp(o, x)) + '</s>';
    return '<td data-c="' + x.c + '" class="' + cls.join(' ') + '"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + inner + '</td>';
  }
  function rowHtml(r, vc) {
    const iss = S.issues.get(r), s = S.sel.has(r);
    let h = '<tr data-r="' + r + '"' + (s ? ' class="sel"' : '') + '><td class="stick c-sel"><label title="Строка ' + r + ' в Excel"><input type="checkbox" data-sel="' + r + '"' + (s ? ' checked' : '') + ' aria-label="Отметить строку ' + r + '">' + r + '</label></td>';
    for (const x of vc) h += cellHtml(r, x, iss);
    return h + '</tr>';
  }
  function renderGrid() {
    closeEditor(false);
    const vc = visibleCols(), rows = S.filtered = filteredRows(), per = S.cfg.per || 100;
    const pages = Math.max(1, Math.ceil(rows.length / per));
    if (S.view.page >= pages) S.view.page = pages - 1;
    const from = S.view.page * per, slice = rows.slice(from, from + per);
    const allSel = rows.length > 0 && rows.every(r => S.sel.has(r));
    let h = '<thead><tr><th class="stick c-sel"><label title="Отметить все строки по фильтру"><input type="checkbox" id="selAll"' + (allSel ? ' checked' : '') + ' aria-label="Отметить все"></label></th>';
    let pg = null;
    for (const x of vc) { h += thHtml(x, pg); if (x.role !== 'key') pg = x.group; }
    h += '</tr></thead><tbody>';
    for (const r of slice) h += rowHtml(r, vc);
    if (!slice.length) h += '<tr><td colspan="' + (vc.length + 1) + '" class="empty-grid">' + (S.M.rows.length ? 'Ничего не найдено. Измените поиск, условие или фильтр.' : 'В таблице нет строк с артикулами. Проверьте разметку в настройке.') + '</td></tr>';
    $('grid').innerHTML = h + '</tbody>';
    renderPager();
  }
  function updateRow(r) {
    const tr = $('grid').querySelector('tr[data-r="' + r + '"]');
    if (!tr) return;
    const tmp = document.createElement('tbody');
    tmp.innerHTML = rowHtml(r, visibleCols());
    tr.replaceWith(tmp.firstChild);
  }

  /* ---------- правка в ячейке ---------- */
  function startEdit(td) {
    const tr = td.closest('tr'), r = +tr.dataset.r, c = +td.dataset.c, x = colOf(c);
    if (!x) return;
    if (readOnly(x)) {
      toast(x.role === 'key' ? 'Артикул не меняем: по нему Ozon находит товар.' : 'В шаблоне колонка помечена «Нередактируемое». Разрешить правку можно в настройке.');
      return;
    }
    const cur = get(r, c);
    if (isLong(x) || cur.length > 140 || cur.includes('\n')) { openTextEditor(r, c); return; }
    if (S.ed) {
      closeEditor(true);
      td = $('grid').querySelector('tr[data-r="' + r + '"] td[data-c="' + c + '"]');
      if (!td) return;
    }
    const wrap = document.createElement('div'); wrap.className = 'ed';
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = cur; inp.setAttribute('aria-label', x.title + ', строка ' + r);
    if (x.numeric) inp.inputMode = 'decimal';
    wrap.appendChild(inp);
    let ct = null;
    if (x.role === 'name') { ct = document.createElement('span'); ct.className = 'ct'; wrap.appendChild(ct); ct.textContent = cur.length + ' зн.'; }
    td.appendChild(wrap);
    inp.focus(); inp.select();
    S.ed = { r, c, td, inp, x };
    inp.addEventListener('input', () => { if (ct) ct.textContent = inp.value.length + ' зн.'; if (x.list) showSugg(); });
    inp.addEventListener('keydown', onEdKey);
    inp.addEventListener('blur', () => setTimeout(() => { if (S.ed && S.ed.inp === inp && document.activeElement !== inp) commitEditor(null); }, 150));
    if (x.list) showSugg();
  }
  function closeEditor(commit) {
    if (!S.ed) return;
    if (commit) { commitEditor(null); return; }
    const ed = S.ed; S.ed = null; hideSugg();
    const w = ed.td.querySelector('.ed'); if (w) w.remove();
  }
  function commitEditor(move) {
    const ed = S.ed; if (!ed) return;
    S.ed = null; hideSugg();
    const v = normalizeFor(ed.x, ed.inp.value);
    const w = ed.td.querySelector('.ed'); if (w) w.remove();
    applyChanges([{ r: ed.r, c: ed.c, v }], ed.x.title + ', ' + keyOf(ed.r));
    if (move) moveFrom(ed.r, ed.c, move);
  }
  function moveFrom(r, c, dir) {
    const grid = $('grid');
    const vc = visibleCols().filter(x => !readOnly(x));
    let tr = grid.querySelector('tr[data-r="' + r + '"]');
    if (!tr) return;
    if (dir === 'down' || dir === 'up') {
      tr = dir === 'down' ? tr.nextElementSibling : tr.previousElementSibling;
      if (!tr || !tr.dataset.r) return;
    } else {
      const i = vc.findIndex(x => x.c === c), j = i + (dir === 'right' ? 1 : -1);
      if (j < 0 || j >= vc.length) return;
      c = vc[j].c;
    }
    const td = tr.querySelector('td[data-c="' + c + '"]');
    if (td) { td.scrollIntoView({ block: 'nearest', inline: 'nearest' }); startEdit(td); }
  }
  function onEdKey(e) {
    const sg = S.sug && !$('sugg').hidden ? S.sug : null;
    if (sg && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      sg.hl = Math.max(0, Math.min(sg.items.length - 1, sg.hl + (e.key === 'ArrowDown' ? 1 : -1)));
      $('sugg').querySelectorAll('[data-i]').forEach(d => d.classList.toggle('hl', +d.dataset.i === sg.hl));
      const hl = $('sugg').querySelector('.hl'); if (hl) hl.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (sg && sg.hl >= 0) { pickSugg(sg.hl, true); return; }
      commitEditor(e.shiftKey ? 'up' : 'down');
    } else if (e.key === 'Tab') {
      e.preventDefault(); commitEditor(e.shiftKey ? 'left' : 'right');
    } else if (e.key === 'Escape') {
      e.preventDefault();
      if (sg) hideSugg(); else closeEditor(false);
    }
  }

  /* подсказки из списка значений шаблона */
  function showSugg() {
    const ed = S.ed; if (!ed || !ed.x.list) return;
    const parts = ed.inp.value.split(';'), last = Model.norm(parts[parts.length - 1]);
    const all = ed.x.list;
    const exact = all.some(v => Model.norm(v) === last);
    const items = all.filter(v => !last || exact || Model.norm(v).includes(last)).slice(0, 80);
    const box = $('sugg');
    if (!items.length) { hideSugg(); return; }
    box.innerHTML = (all.length > items.length ? '<div class="cap">Найдено ' + items.length + ' из ' + all.length + ' · вводите для поиска</div>' : '<div class="cap">Значения из шаблона</div>') +
      items.map((v, i) => '<div data-i="' + i + '" role="option">' + esc(v) + '</div>').join('');
    S.sug = { items, hl: -1 };
    const rc = ed.td.getBoundingClientRect();
    box.style.minWidth = Math.max(200, rc.width) + 'px';
    box.style.left = Math.max(8, Math.min(rc.left, window.innerWidth - Math.max(200, rc.width) - 8)) + 'px';
    box.hidden = false;
    const h = box.offsetHeight;
    box.style.top = (rc.bottom + h + 8 > window.innerHeight && rc.top - h - 4 > 0 ? rc.top - h - 4 : rc.bottom + 2) + 'px';
  }
  function hideSugg() { $('sugg').hidden = true; S.sug = null; }
  function pickSugg(i, viaKey) {
    const ed = S.ed; if (!ed || !S.sug) return;
    const parts = ed.inp.value.split(';');
    parts[parts.length - 1] = (parts.length > 1 ? ' ' : '') + S.sug.items[i];
    ed.inp.value = parts.join(';');
    hideSugg();
    if (parts.length > 1) { ed.inp.focus(); return; }
    commitEditor(viaKey ? 'down' : null);
  }

      '<div class="count" id="teCount"></div>' +
      (S.edits.has(k) ? '<div class="fld"><span>Было</span><div class="was-box">' + (o ? esc(o) : '(пусто)') + '</div></div>' : '') +
      '<div class="inl"><button class="btn primary" data-act="teSave">Сохранить</button><button class="btn" data-act="close">Отмена</button>' +
      (S.edits.has(k) ? '<button class="btn quiet" data-act="teRevert">Вернуть исходное</button>' : '') + '</div>' +

    ta.addEventListener('input', cnt); cnt();

  function teSave(revert) {

  /* список изменений */
  function openChanges() {
    const byRow = new Map();
    for (const [k, v] of S.edits) { const [r, c] = k.split(':').map(Number); if (!byRow.has(r)) byRow.set(r, []); byRow.get(r).push([c, v]); }
    const rows = [...byRow.keys()].sort((a, b) => a - b);
    const ic = issueCounts(new Set(rows));
    let h = '<div class="note">' + (S.edits.size ? plural(S.edits.size, 'правка', 'правки', 'правок') + ' в ' + plural(rows.length, 'товаре', 'товарах', 'товарах') +
      (ic.err ? ' · <b style="color:var(--bad)">' + plural(ic.err, 'ошибка', 'ошибки', 'ошибок') + '</b>' : '') : 'Правок пока нет. Кликните по ячейке в таблице, чтобы изменить значение.') + '</div>';
    if (S.edits.size) h += '<div class="inl"><button class="btn small" data-act="copyChanges">Скопировать списком</button><button class="btn small" data-act="resetAll" id="resetAll">Сбросить все</button></div>';

      for (const [c, v] of byRow.get(r).sort((a, b) => a[0] - b[0])) {
        const x = colOf(c), o = orig(r, c), is = S.issues.get(r) && S.issues.get(r).get(c);

        h += '<div class="chg-line"><div class="v"><div class="f">' + esc(x ? x.title : XL.idxToCol(c)) + '</div><s>' + esc(short(x ? disp(o, x) : o)) + '</s> → <span class="nv">' + esc(short(x ? disp(v, x) : v)) + '</span>' +
          (is ? '<div style="color:var(--' + (is.lvl === 'err' ? 'bad' : 'warn') + ');font-size:12px">' + esc(is.msg) + '</div>' : '') + '</div>' +

  let resetArm = 0;
  function resetAll(btn) {

    toast('Все правки сброшены', [['Отменить', undo]], 6000);

  async function copyChanges() {
    const lines = ['Артикул\tКолонка\tБыло\tСтало'];
    for (const [k, v] of S.edits) { const [r, c] = k.split(':').map(Number); const x = colOf(c); lines.push([keyOf(r), x ? x.title : c, orig(r, c), v].map(s => String(s).replace(/[\t\n]+/g, ' ')).join('\t')); }
    try { await navigator.clipboard.writeText(lines.join('\n')); toast('Список скопирован — вставьте в Excel или заметку'); }

      const [r, c] = k.split(':').map(Number), x = colOf(c), oc = origCell(r, c), n = Model.parseNum(v);
      let numeric = false;
      if (v !== '' && !isNaN(n)) numeric = oc && oc.v !== '' ? !!oc.num : !!(x && x.numeric);
      list.push({ r, c, value: numeric ? Model.fmtNum(n) : v, numeric });

      const blob = await XL.exportFile(S.file.buf, S.sheet, list);

      else if (act === 'next') { S.view.page++; renderGrid(); $('gridWrap').scrollTop = 0; }
      else if (act === 'clearSel') { S.sel.clear(); renderGrid(); }
      else if (act === 'hideNotice') hideNotice();
      else if (act === 'showErr') setShow('err');
      else if (act === 'settings') openSettings();
      else if (act === 'close') { S.te = null; closeDrawer(); }
      else if (act === 'teSave') teSave(false);
      else if (act === 'teRevert') teSave(true);
      else if (act === 'copyChanges') copyChanges();
      else if (act === 'resetAll') resetAll(a);
      else if (act === 'massApply') massApply();
      else if (act === 'stApply') stApply(false);
      else if (act === 'stAuto') stApply(true);
      else if (act === 'stForget') { IDB.del('file'); IDB.del('state'); toast('Сохранённая работа удалена из браузера'); }
      else if (act === 'colsAll' || act === 'colsNone') document.querySelectorAll('#colList input:not([disabled])').forEach(i => { i.checked = act === 'colsAll'; });
      else if (act === 'colsDone') {
        S.view.custom = [...document.querySelectorAll('#colList input:checked')].map(i => +i.value);
        S.view.preset = 'custom'; S.view.page = 0; closeDrawer(); renderPresets(); renderGrid(); scheduleSave();
      }
    });
    $('pager').addEventListener('change', e => { if (e.target.id === 'perSel') { S.cfg.per = +e.target.value; saveCfg(); S.view.page = 0; renderGrid(); } });
    $('drBody').addEventListener('change', e => {
      const t = e.target;
      if (S.drawer === 'mass') {
        if (t.id === 'mCol') { S.mass.col = +t.value; massOps(); }
        else if (t.id === 'mOp') { S.mass.op = t.value; massParams(); }
        else massPreview();
      } else if (S.drawer === 'settings') {
        if (t.id === 'stGap') { S.cfg.gap = t.checked; saveCfg(); recheckAll(); renderGrid(); updateCounts(); }
        if (t.id === 'stUnlock') { S.cfg.unlock = t.checked; saveCfg(); renderGrid(); }
      }
    });
    $('drBody').addEventListener('input', e => { if (S.drawer === 'mass' && e.target.id !== 'mCol' && e.target.id !== 'mOp') massPreview(); });
    $('sugg').addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); e.preventDefault(); if (d) pickSugg(+d.dataset.i, false); });
    $('gridWrap').addEventListener('scroll', () => { if (S.ed && S.sug) showSugg(); }, { passive: true });
    document.addEventListener('keydown', e => {
      const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !inField) { e.preventDefault(); undo(); }
      else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key.toLowerCase() === 'я') && !inField) { e.preventDefault(); undo(); }
      else if (e.key === 'Escape' && !S.ed && !$('drawer').hidden) closeDrawer();
    });
    // перетаскивание файла
    let dragN = 0;
    window.addEventListener('dragenter', e => { if ([...(e.dataTransfer && e.dataTransfer.types || [])].includes('Files')) { dragN++; $('drop').hidden = false; } });
    window.addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) $('drop').hidden = true; });
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('drop').hidden = true; const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) openFile(f); });
  }
  function renderPager() {
    const per = S.cfg.per || 100, n = S.filtered.length, from = S.view.page * per;
    const pages = Math.max(1, Math.ceil(n / per));
    $('pager').innerHTML = (n ? 'Строки <b>' + (from + 1) + '–' + Math.min(from + per, n) + '</b> из <b>' + n + '</b>' : 'Нет строк') +
      (S.M.rows.length !== n ? ' <span>(всего ' + S.M.rows.length + ')</span>' : '') +
      ' <button class="btn small" data-act="prev"' + (S.view.page ? '' : ' disabled') + '>Назад</button><button class="btn small" data-act="next"' + (S.view.page < pages - 1 ? '' : ' disabled') + '>Дальше</button>' +
      ' <select id="perSel" aria-label="Строк на странице">' + [50, 100, 200, 500].map(k => '<option value="' + k + '"' + (k === per ? ' selected' : '') + '>по ' + k + '</option>').join('') + '</select>' +
      (S.sel.size ? ' <span>отмечено: <b>' + S.sel.size + '</b></span> <button class="btn small quiet" data-act="clearSel">Снять отметки</button>' : '') +
      '<span class="sp"></span><span class="privacy">Файл не покидает ваш браузер</span>';
  }

  /* ---------- запуск ---------- */
  async function start() {
    bind();
    if (typeof JSZip === 'undefined') { showError('Не загрузилась библиотека для чтения Excel. Проверьте интернет и обновите страницу.'); return; }
    let f = null, st = null;
    try { f = await IDB.get('file'); st = f ? await IDB.get('state') : null; } catch (e) { f = null; }
    if (f && f.buf) {
      const same = st && st.name === f.name;
      await openBuffer(f.buf, f.name, { edits: same ? st.edits : [], sheet: same ? st.sheet : '', over: same ? st.over : {}, view: same ? st.view : null, restored: (same && st.savedAt) || f.savedAt });
      if (S.file) return;
    }
    const b64 = window.DEMO_XLSX || '';
    if (!b64) { $('fname').textContent = 'Откройте шаблон Ozon (.xlsx)'; return; }
    const bin = atob(b64), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    await openBuffer(u.buffer, 'пример-шаблон-товаров.xlsx', { demo: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
